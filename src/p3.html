<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════
   Valores por defecto — sacados de una hoja real de control horario
   de turnos de aeropuerto (el bloque de mes más reciente).
   ═══════════════════════════════════════════════════════════ */
var DEF_RATES = {
  noc:    1.61,   // € por hora trabajada entre 22:00 y 06:00
  mad:    6.43,   // € por día que entra entre 04:00 y 06:55
  fes:    2.85,   // € por hora, adicional, en día festivo
  dom:    2.80,   // € por domingo trabajado
  frac:  11.34,   // € por día de turno partido
  transp: 2.83,   // € por día de asistencia
  manut:  6.24,   // € por día de más de 6 h
  tfd:   90.00,   // € fijo al mes
  per:   22.00    // € por perentoria
};
var DEF_BASE = { base:__BASE__, umbral:151, valorCompl:10.25, impuestos:150, fesHoras:6, madNoc:1,
                 impModo:"FIJO", impSS:6.47, impIRPF:2.5, festCV:1 };
/* madNoc = 1 → un día con madrugue NO cobra además la nocturnidad de esas horas.
   Es como está el Excel: los turnos de mañana que entran a las 04:00 o 05:00
   cobran el madrugue (6,43 €) y no la nocturnidad de 04:00-06:00.              */

var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DIAS  = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var TURNOS = [
  {k:"MANANA", n:"Mañana",     ic:"🌅"},
  {k:"TARDE",  n:"Tarde",      ic:"🌇"},
  {k:"NOCHES", n:"Noches",     ic:"🌙"},
  {k:"LIBRE",  n:"Libre",      ic:"🌿"},
  {k:"VACAS",  n:"Vacaciones", ic:"🏖️"}
];
/* ═══════════ el cuadrante: ciclo de 3 semanas que siempre empieza en lunes ═══
   Semana 1  L a D  ................. tardes
   Semana 2  L M X libre · J a D .... mañanas
   Semana 3  L M X mañanas · J a D .. libre
   Son 21 días justos, así que cae siempre en el mismo día de la semana.     */
var CICLO = [
  "TARDE","TARDE","TARDE","TARDE","TARDE","TARDE","TARDE",
  "LIBRE","LIBRE","LIBRE","MANANA","MANANA","MANANA","MANANA",
  "MANANA","MANANA","MANANA","LIBRE","LIBRE","LIBRE","LIBRE"
];
var SEMANAS = [
  {i:0,  t:"Tardes toda la semana"},
  {i:7,  t:"Libro lunes, martes y miércoles · mañanas de jueves a domingo"},
  {i:14, t:"Mañanas hasta el miércoles · libro de jueves a domingo"}
];
/* Horas por defecto de cada turno. Mañana y noche salen de su Excel; la de
   tarde es una suposición y por eso el cuadrante las enseña para confirmarlas. */
var PLANTILLA_DEF = {
  MANANA: {i:"05:00", o:"13:00"},
  TARDE:  {i:"16:00", o:"23:00"},   /* los 7 dias seguidos de junio que ella
                                       apunto como "noches" son en realidad
                                       este turno; que lo confirme */
  NOCHES: {i:"22:00", o:"06:00"}
};
var KEY = "fichaje_turnos_v1";
/* Foto de perfil por defecto y de quién es. Las pone build.py desde archivos
   locales que no van al repositorio; sin ellos se queda la inicial del nombre.
   Si se pone otra desde Ajustes, manda esa (vive en localStorage). */
var FOTO_DEF = "__FOTO__";
var FOTO_DE  = "__FOTO_DE__";

/* ── estado ── */
var DB, vista = "Hoy", mesActivo, diaAbierto = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return (n<10?"0":"")+n; }
/* __hoy le permite a test_motor / a mí fingir otra fecha para probar el cambio de mes.
   Sin tocarla devuelve la de verdad. */
function hoyDate(){ return window.__hoy ? new Date(window.__hoy) : new Date(); }
function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function mkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function parseDk(dk){ var p=dk.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function prevMk(mk){ var y=+mk.slice(0,4), m=+mk.slice(5,7)-1; if(m<1){m=12;y--;} return y+"-"+pad(m); }
function nextMk(mk){ var y=+mk.slice(0,4), m=+mk.slice(5,7)+1; if(m>12){m=1;y++;} return y+"-"+pad(m); }
function nomMes(mk){ return MESES[+mk.slice(5,7)-1]+" "+mk.slice(0,4); }

function eur(n){
  if(!isFinite(n)) n=0;
  return n.toFixed(2).replace(".",",")+" €";
}
function num(n, d){
  d = d==null?2:d;
  var s = (Math.round(n*100)/100).toFixed(d).replace(".",",");
  return s.replace(/,?0+$/,"") || "0";
}
function horas(h){
  if(!h) return "0 h";
  var t = Math.round(h*60), H = Math.floor(t/60), M = t%60;
  return M ? H+" h "+pad(M)+"m" : H+" h";
}

/* ═══════════════ persistencia ═══════════════ */
/* Rellena lo que falte SIN volver a leer del movil. Se usa tanto al abrir como
   al restaurar una copia: si aqui se releyera localStorage, restaurar no haria
   nada y se perderia la copia. */
function normaliza(){
  if(!DB || typeof DB!=="object") DB = {};
  if(DB.nombre == null) DB.nombre = "";
  if(!DB.modo)   DB.modo = "VENCIDO";
  if(!DB.meses)  DB.meses = {};
  if(!DB.ajustes) DB.ajustes = {};
  if(!DB.ajustes.rates) DB.ajustes.rates = clone(DEF_RATES);
  if(!DB.ajustes.base)  DB.ajustes.base  = clone(DEF_BASE);
  rellena(DB.ajustes.rates, DEF_RATES);
  rellena(DB.ajustes.base,  DEF_BASE);
  /* y tambien los meses ya guardados, que pueden ser de una version anterior
     y no tener los ajustes nuevos */
  Object.keys(DB.meses).forEach(function(k){
    var c = DB.meses[k] && DB.meses[k].cfg;
    if(!c) return;
    if(!c.rates) c.rates = clone(DEF_RATES);
    if(!c.base)  c.base  = clone(DEF_BASE);
    rellena(c.rates, DEF_RATES);
    rellena(c.base,  DEF_BASE);
  });
}
function rellena(dest, def){
  Object.keys(def).forEach(function(k){ if(dest[k] == null) dest[k] = def[k]; });
}
function cargar(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if(!raw) raw = rescataClaveVieja();
  DB = null;
  if(raw){ try { DB = JSON.parse(raw); } catch(e){ DB = null; } }
  normaliza();
}
/* Si una versión anterior guardaba con otro nombre de clave, se recupera lo que
   hubiera. Sin esto, renombrar la clave le borraría los meses ya apuntados. */
function rescataClaveVieja(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(!k || k === KEY || k.indexOf("fichaje") !== 0) continue;
      var v = localStorage.getItem(k);
      if(v && v.indexOf('"meses"') >= 0){
        localStorage.setItem(KEY, v);      /* se copia a la clave nueva */
        return v;
      }
    }
  }catch(e){}
  return null;
}
var tGuardar = null, fallaGuardar = false;
function guardar(){
  if(tGuardar) clearTimeout(tGuardar);
  tGuardar = setTimeout(function(){
    try {
      localStorage.setItem(KEY, JSON.stringify(DB));
      if(fallaGuardar){ fallaGuardar = false; render(); }
    } catch(e){
      fallaGuardar = true;
      toast("No se pudo guardar: haz una copia de seguridad ya");
      render();
    }
  }, 120);
}

/* ═══════════════ meses y config ═══════════════ */
function cfgDe(mk){
  var M = DB.meses[mk];
  if(M && M.cfg) return M.cfg;
  /* hereda del mes con datos más reciente que sea anterior o igual */
  var ks = Object.keys(DB.meses).filter(function(k){ return k<=mk && DB.meses[k].cfg; }).sort();
  if(ks.length) return DB.meses[ks[ks.length-1]].cfg;
  return { rates: DB.ajustes.rates, base: DB.ajustes.base };
}
function mesW(mk){                       /* para escribir: crea y congela cfg */
  if(!DB.meses[mk]) DB.meses[mk] = { cfg: clone(cfgDe(mk)), dias:{} };
  if(!DB.meses[mk].cfg)  DB.meses[mk].cfg  = clone(cfgDe(mk));
  if(!DB.meses[mk].dias) DB.meses[mk].dias = {};
  return DB.meses[mk];
}
function diaR(dk){ var M = DB.meses[dk.slice(0,7)]; return (M && M.dias && M.dias[dk]) || null; }
/* diaW normal lo usa tambien el cuadrante; mio() marca que lo ha tocado ella,
   para que el automatico no se lo pise nunca mas */
function mio(dk){ var w = diaW(dk); delete w.auto; return w; }
function diaW(dk){
  var M = mesW(dk.slice(0,7));
  if(!M.dias[dk]) M.dias[dk] = { t:[], turno:"", per:0, fes:null };
  if(!M.dias[dk].t) M.dias[dk].t = [];
  return M.dias[dk];
}

/* ═══════════════ festivos nacionales ═══════════════
   Los 9 fijos de toda España mas el Viernes Santo, que se mueve. Jueves Santo
   NO va: no es festivo en la Comunidad Valenciana ni en Cataluna. Los de la
   comunidad y los del pueblo se marcan a mano tocando el dia.            */
var FEST_FIJOS = ["01-01","01-06","05-01","08-15","10-12","11-01","12-06","12-08","12-25"];
/* Comunitat Valenciana: San Jose, el 9 d'Octubre, y dos que se mueven con la
   Pascua (Lunes de Pascua y Sant Vicent Ferrer). Aqui NO va el Jueves Santo:
   en la Comunitat Valenciana no es festivo, se cambia por el Lunes de Pascua. */
var FEST_CV_FIJOS = ["03-19","10-09"];
var cacheFest = {};
function pascua(y){                       /* Meeus/Jones/Butcher */
  var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7,
      m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
  return new Date(y, mes-1, dia);
}
function masDias(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function festivosDe(y, cv){
  var clave = y + (cv ? "cv" : "");
  if(cacheFest[clave]) return cacheFest[clave];
  var s = {}, p = pascua(y);
  FEST_FIJOS.forEach(function(f){ s[y+"-"+f] = 1; });
  s[dkey(masDias(p,-2))] = 1;                       /* Viernes Santo */
  if(cv){
    FEST_CV_FIJOS.forEach(function(f){ s[y+"-"+f] = 1; });
    s[dkey(masDias(p, 1))] = 1;                     /* Lunes de Pascua */
    s[dkey(masDias(p, 8))] = 1;                     /* Sant Vicent Ferrer */
  }
  return (cacheFest[clave] = s);
}
function esFestivoNac(dk){
  var cv = cfgDe(dk.slice(0,7)).base.festCV !== 0;
  return !!festivosDe(+dk.slice(0,4), cv)[dk];
}
/* fes: null/undefined = lo que diga el calendario; true/false = lo dijo ella */
function fesEfectivo(dk, d){
  if(d && (d.fes===true || d.fes===false)) return d.fes;
  return esFestivoNac(dk);
}

/* ═══════════════ cálculo ═══════════════ */
function m2n(s){
  if(!s || s.indexOf(":")<0) return null;
  var p = s.split(":"), h = +p[0], m = +p[1];
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function durMin(tr){
  var a = m2n(tr.i), b = m2n(tr.o);
  if(a==null || b==null) return 0;
  var d = b-a; if(d<0) d += 1440;      /* cruza medianoche */
  return d;
}
/* minutos del tramo que caen entre las 22:00 y las 06:00 */
function nocMin(tr){
  var a = m2n(tr.i); if(a==null) return 0;
  var d = durMin(tr); if(d<=0) return 0;
  var s = a, e = a+d, tot = 0;
  for(var k=-1;k<=2;k++){
    var ws = k*1440+1320, we = k*1440+1800;   /* 22:00 → 06:00 del día siguiente */
    tot += Math.max(0, Math.min(e,we) - Math.max(s,ws));
  }
  return tot;
}
function calcDia(dk, d){
  var r = {horas:0,noc:0,mad:0,manut:0,transp:0,dom:0,frac:0,per:0,fes:false,tramos:0,larga:0};
  if(!d) return r;
  var mins=0, nm=0, mad=false, n=0;
  (d.t||[]).forEach(function(tr){
    var du = durMin(tr); if(du<=0) return;
    n++; mins += du; nm += nocMin(tr);
    var a = m2n(tr.i);
    if(a!=null && a>=240 && a<=415) mad = true;   /* entrada entre 04:00 y 06:55 */
  });
  r.tramos = n;
  r.incompleto = (d.t||[]).some(function(tr){    /* puso una hora y se dejo la otra */
    return (!!tr.i !== !!tr.o);
  }) ? 1 : 0;
  r.horas  = mins/60;
  r.noc    = nm/60;
  r.mad    = mad ? 1 : 0;
  /* el madrugue y la nocturnidad se pisan en la franja 04:00-06:00: se cobra uno */
  if(r.mad && cfgDe(dk.slice(0,7)).base.madNoc){ r.nocBruta = r.noc; r.noc = 0; }
  r.manut  = r.horas > 6 ? 1 : 0;
  r.transp = r.horas > 0 ? 1 : 0;
  r.frac   = n >= 2 ? 1 : 0;
  r.larga  = r.horas > 8 ? 1 : 0;
  r.per    = +(d.per||0);
  r.fes    = fesEfectivo(dk, d) && r.horas > 0;
  r.dom    = (parseDk(dk).getDay()===0 && r.horas>0) ? 1 : 0;
  return r;
}
function calcMes(mk){
  var M = DB.meses[mk], dias = (M && M.dias) || {};
  var t = {horas:0,noc:0,mad:0,manut:0,transp:0,dom:0,frac:0,per:0,fes:0,dias:0,vacio:true};
  Object.keys(dias).forEach(function(dk){
    if(dk.slice(0,7)!==mk) return;
    var c = calcDia(dk, dias[dk]);
    t.horas+=c.horas; t.noc+=c.noc; t.mad+=c.mad; t.manut+=c.manut;
    t.transp+=c.transp; t.dom+=c.dom; t.frac+=c.frac; t.per+=c.per;
    if(c.fes) t.fes++;
    if(c.horas>0){ t.dias++; t.vacio=false; }
  });
  var B = cfgDe(mk).base;
  t.compl = Math.max(0, t.horas - B.umbral);
  return t;
}
/* Devuelve la estimación de pago del mes mk según el modo elegido. */
function calcPago(mk){
  var cfg = cfgDe(mk), R = cfg.rates, B = cfg.base;
  var propio = calcMes(mk);
  var srcMk  = DB.modo==="VENCIDO" ? prevMk(mk) : mk;
  var src    = DB.modo==="VENCIDO" ? calcMes(srcMk) : propio;
  var ad = {
    noc:    src.noc    * R.noc,
    mad:    src.mad    * R.mad,
    fes:    src.fes    * R.fes * (B.fesHoras||6),
    dom:    src.dom    * R.dom,
    frac:   src.frac   * R.frac,
    transp: src.transp * R.transp,
    manut:  src.manut  * R.manut,
    tfd:    R.tfd,
    per:    src.per    * R.per
  };
  var totalAd = 0; Object.keys(ad).forEach(function(k){ totalAd += ad[k]; });
  var complEur  = src.compl * B.valorCompl;
  var totalBase = B.base + complEur;
  var bruto     = totalBase + totalAd;
  var porc      = B.impModo === "PORC";
  var ss        = porc ? bruto * (B.impSS||0)/100   : 0;
  var irpf      = porc ? bruto * (B.impIRPF||0)/100 : 0;
  var imp       = porc ? ss + irpf : B.impuestos;
  return {
    cfg:cfg, R:R, B:B, propio:propio, src:src, srcMk:srcMk, ad:ad,
    totalAd:totalAd, complEur:complEur, compl:src.compl,
    totalBase:totalBase, bruto:bruto, porc:porc, ss:ss, irpf:irpf, impuestos:imp,
    aCobrar: bruto - imp
  };
}

/* ═══════════════ utilidades de UI ═══════════════ */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
var tToast=null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  if(tToast) clearTimeout(tToast);
  tToast = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
function abrir(id){ $("ov").classList.add("on"); $(id).classList.add("on"); }
function cerrar(id){ $("ov").classList.remove("on"); $(id).classList.remove("on"); diaAbierto=null; }
function cerrarTodo(){ $("ov").classList.remove("on"); ["shDia","shInfo"].forEach(function(i){ $(i).classList.remove("on"); }); diaAbierto=null; }

/* ═══════════════ cuadrante ═══════════════ */
function lunesDe(d){ var x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function diasEntre(a, b){ return Math.round((a - b) / 86400000); }
/* Qué turno toca ese día según el ciclo, o "" si no hay cuadrante puesto */
function turnoCiclo(dk){
  var C = DB.cuadrante;
  if(!C || !C.ancla) return "";
  var n = diasEntre(parseDk(dk), parseDk(C.ancla));
  return CICLO[((n % 21) + 21) % 21];
}
/* Las horas que suele hacer en ese turno; si no hay nada apuntado, las de fábrica */
function horasHabituales(turno){
  var mejor = null;
  Object.keys(DB.meses).sort().forEach(function(mk){
    var ds = (DB.meses[mk] || {}).dias || {};
    Object.keys(ds).sort().forEach(function(dk){
      var d = ds[dk];
      if(d && !d.auto && d.turno === turno && (d.t||[]).length === 1 && d.t[0].i && d.t[0].o) mejor = d.t[0];
    });
  });
  return mejor ? {i:mejor.i, o:mejor.o} : clone(PLANTILLA_DEF[turno] || {i:"",o:""});
}
function plantilla(){
  if(!DB.plantilla) DB.plantilla = {};
  ["MANANA","TARDE","NOCHES"].forEach(function(k){
    if(!DB.plantilla[k]) DB.plantilla[k] = horasHabituales(k);
  });
  return DB.plantilla;
}
/* Rellena los días vacíos (y los que ya puso el propio cuadrante) del rango.
   Lo que ella haya apuntado a mano no se toca jamás. */
function aplicaCuadrante(desde, hasta){
  var C = DB.cuadrante;
  if(!C || !C.ancla || !C.auto) return 0;
  var P = plantilla(), n = 0, x = new Date(desde);
  while(x <= hasta){
    var dk = dkey(x), d = diaR(dk);
    var libre = !d || (d.auto && !d.fes && !d.per);
    if(libre && !(d && (d.t||[]).some(function(tr){ return tr.i || tr.o; }) && !d.auto)){
      var turno = turnoCiclo(dk);
      var h = P[turno];
      var w = diaW(dk);
      w.turno = turno;
      w.t = h && h.i && h.o ? [{i:h.i, o:h.o}] : [];
      w.auto = 1;
      n++;
    }
    x.setDate(x.getDate()+1);
  }
  if(n) guardar();
  return n;
}
/* Al abrir y al cambiar de mes: deja hechos el mes en curso y el siguiente */
function cuadranteAlDia(){
  if(!DB.cuadrante || !DB.cuadrante.auto) return;
  var h = hoyDate();
  var desde = lunesDe(new Date(h.getFullYear(), h.getMonth(), 1));
  var hasta = new Date(h.getFullYear(), h.getMonth()+2, 0);
  aplicaCuadrante(desde, hasta);
}
/* Si cambia las horas de un turno, los días que puso el cuadrante se rehacen
   al momento. Si no, seguirían con las viejas hasta el siguiente arranque. */
function reaplicaAuto(){
  var P = plantilla(), n = 0;
  Object.keys(DB.meses).forEach(function(mk){
    var ds = DB.meses[mk].dias || {};
    Object.keys(ds).forEach(function(dk){
      var d = ds[dk];
      if(!d.auto) return;
      var h = P[d.turno];
      d.t = (h && h.i && h.o) ? [{i:h.i, o:h.o}] : [];
      n++;
    });
  });
  if(n) guardar();
  return n;
}
/* Borra lo que puso el cuadrante y deja lo suyo */
function borraAuto(){
  var n = 0;
  Object.keys(DB.meses).forEach(function(mk){
    var ds = DB.meses[mk].dias || {};
    Object.keys(ds).forEach(function(dk){ if(ds[dk].auto){ delete ds[dk]; n++; } });
  });
  if(n) guardar();
  return n;
}

/* ═══════════════ escribir la hora a mano ═══════════════
   Ella lo pidió así: "lo que queremos es poder escribir el número". Traga 5,
   05, 530, 0530, 5:30 y 17:16, y va poniendo los dos puntos sola.        */
function soloDigitos(s){ return String(s||"").replace(/\D/g,"").slice(0,4); }
/* lo que se ve mientras teclea: 5 · 17 · 17:1 · 17:16 · 5:3 · 5:30 */
function vistaHora(d){
  if(d.length <= 1) return d;
  if(+d.slice(0,2) <= 23) return d.length <= 2 ? d : d.slice(0,2)+":"+d.slice(2,4);
  return d.slice(0,1)+":"+d.slice(1,3);          /* "53" solo puede ser 5:3x */
}
/* al salir del campo se deja en HH:MM, o null si no hay manera */
function hhmm(s){
  var d = soloDigitos(s);
  if(!d) return "";
  var hs, ms;
  if(d.length === 4){ hs = d.slice(0,2); ms = d.slice(2,4); }   /* 4 cifras son HHMM y punto */
  else if(d.length <= 2 && +d <= 23){ hs = d; ms = "00"; }
  else if(d.length === 3 && +d.slice(0,2) <= 23){ hs = d.slice(0,2); ms = d.slice(2); }
  else { hs = d.slice(0,1); ms = d.slice(1,3); }                /* "530" solo puede ser 5:30 */
  if(ms.length === 1) ms += "0";                 /* "17:1" se entiende 17:10 */
  var h = +hs, m = +ms;
  if(h > 23 || m > 59) return null;
  return pad(h)+":"+pad(m);
}
function campoHora(dk, ids, i, cual, valor){
  var inp = document.createElement("input");
  inp.type = "text"; inp.inputMode = "numeric"; inp.maxLength = 5;
  inp.placeholder = "--:--"; inp.value = valor || "";
  inp.setAttribute("aria-label", cual === "i" ? "hora de entrada" : "hora de salida");
  inp.onfocus = function(){ inp.select(); };
  inp.oninput = function(){
    var d = soloDigitos(inp.value);
    inp.value = vistaHora(d);
    var w = mio(dk), t = w.t[i] || (w.t[i] = {i:"",o:""});
    var v = hhmm(d);
    t[cual] = (v === null) ? "" : v;
    if(cual === "i" && !w.turno && v){
      var mm = m2n(v);
      w.turno = (mm == null) ? "" : (mm < 720 ? "MANANA" : (mm < 1200 ? "TARDE" : "NOCHES"));
    }
    guardar();
    refresca(dk, ids);          /* NO repinta los campos: perderia el teclado */
  };
  inp.onblur = function(){
    var v = hhmm(inp.value);
    if(v === null){ inp.value = ""; toast("Esa hora no existe"); }
    else inp.value = v;
    var w = mio(dk); (w.t[i] || (w.t[i] = {i:"",o:""}))[cual] = inp.value;
    guardar(); pintaEditor(dk, ids); render();
  };
  return inp;
}
/* Actualiza solo lo que se deduce (duraciones, chips y el resumen de arriba)
   sin tocar los campos donde está escribiendo. */
function refresca(dk, ids){
  var d = diaR(dk) || {t:[]};
  var filas = $(ids.tramos).children;
  for(var i=0;i<filas.length;i++){
    var s = filas[i].querySelector(".dur");
    if(s){ var du = durMin((d.t||[])[i] || {}); s.textContent = du ? horas(du/60) : "—"; }
  }
  pintaChips(dk, ids.chips);
  if(vista === "Hoy") renderHoyResumen();
  if(vista === "Mes") renderMes();
}
function pintaChips(dk, contId){
  var d = diaR(dk) || {t:[],turno:""}, c = calcDia(dk, d);
  var cC = $(contId); cC.innerHTML = "";
  function chip(cls, txt){ cC.appendChild(el("span","chip "+cls, txt)); }
  if(c.horas>0){
    chip("", horas(c.horas));
    if(c.noc>0)   chip("noc", "🌙 Nocturnidad "+horas(c.noc));
    if(c.mad)     chip("mad", "🌅 Madrugue");
    if(c.frac)    chip("par", "◑ Turno partido");
    if(c.dom)     chip("dom", "☀ Domingo");
    if(c.fes)     chip("fes", "★ Festivo");
    if(c.manut)   chip("man", "🍽 Manutención");
    if(c.larga)   chip("ext", "⚡ Jornada larga");
    if(c.per>0)   chip("per", "⏱ Perentorias "+num(c.per));
  } else {
    chip("", d.turno==="LIBRE" ? "Día libre" : (d.turno==="VACAS" ? "Vacaciones" : "Sin horas todavía"));
  }
  if(c.incompleto) chip("ext", "⚠ Te falta una hora: así no cuenta");
}

/* ═══════════════ editor de un día (compartido) ═══════════════ */
function pintaEditor(dk, ids){
  var d = diaR(dk) || {t:[],turno:"",per:0,fes:false};
  var c = calcDia(dk, d);

  /* turnos */
  var cT = $(ids.turnos); cT.innerHTML = "";
  TURNOS.forEach(function(t){
    var b = el("button","turno");
    b.dataset.t = t.k;
    b.dataset.on = (d.turno===t.k) ? "1" : "0";
    b.innerHTML = '<span class="ic">'+t.ic+'</span>'+t.n;
    b.onclick = function(){
      var w = mio(dk);
      w.turno = (w.turno===t.k) ? "" : t.k;
      guardar(); pintaEditor(dk, ids); render();
    };
    cT.appendChild(b);
  });

  /* tramos: se escriben a mano. Nada de <input type="time">: la rueda de iOS
     lanza un "change" en cada giro, y si aqui se repinta la fila el campo se
     destruye y la rueda se cierra sola al levantar el dedo. */
  var cTr = $(ids.tramos); cTr.innerHTML = "";
  (d.t||[]).forEach(function(tr, i){
    var row = el("div","tramo");
    row.appendChild(el("span","t", i===0 ? "IN" : "+"));
    var a = campoHora(dk, ids, i, "i", tr.i);
    var b = campoHora(dk, ids, i, "o", tr.o);
    row.appendChild(a);
    row.appendChild(el("span","t","→"));
    row.appendChild(b);
    row.appendChild(el("span","dur", durMin(tr) ? horas(durMin(tr)/60) : "—"));
    var x = el("button","del","✕");
    x.onclick = function(){
      var w = mio(dk); w.t.splice(i,1); guardar(); pintaEditor(dk, ids); render();
    };
    row.appendChild(x);
    cTr.appendChild(row);
  });
  if(ids.add) $(ids.add).textContent = (d.t && d.t.length)
    ? "+ Añadir tramo (turno partido)"
    : "+ Poner las horas de este día";

  /* perentorias */
  var cP = $(ids.per); cP.innerHTML = "";
  var menos = el("button",null,"−"), val = el("span","v", num(d.per||0)), mas = el("button",null,"+");
  menos.onclick = function(){ var w=mio(dk); w.per = Math.max(0,(+w.per||0)-0.5); guardar(); pintaEditor(dk,ids); render(); };
  mas.onclick   = function(){ var w=mio(dk); w.per = (+w.per||0)+0.5;             guardar(); pintaEditor(dk,ids); render(); };
  cP.appendChild(menos); cP.appendChild(val); cP.appendChild(mas);

  /* festivo: null = lo que diga el calendario nacional; true/false = lo dijo ella */
  var cF = $(ids.fes), auto = esFestivoNac(dk), ef = fesEfectivo(dk, d);
  cF.dataset.on = ef ? "1" : "0";
  var kF = cF.parentNode.querySelector(".k");
  if(kF) kF.innerHTML = "Festivo <small>" + (auto
      ? (ef ? "festivo nacional, puesto solo" : "es festivo nacional, pero lo has quitado")
      : (ef ? "lo has marcado tú" : "los del pueblo y la comunidad, a mano")) + "</small>";
  cF.onclick = function(){
    var w = mio(dk), nuevo = !fesEfectivo(dk, w);
    w.fes = (nuevo === esFestivoNac(dk)) ? null : nuevo;   /* si coincide, vuelve a automatico */
    guardar(); pintaEditor(dk, ids); render();
  };

  pintaChips(dk, ids.chips);
  /* si es la hoja del dia, el bloque de repetir cambia de texto segun el turno */
  if(ids === IDS_DIA && diaAbierto === dk) pintaRepe(dk);
}
var repeN = 6;
function pintaRepe(dk){
  var d = diaR(dk), hay = d && ((d.t||[]).length || d.turno);
  $("repeCard").classList.toggle("hide", !hay);
  if(!hay) return;
  var c = $("repeStep"); c.innerHTML = "";
  var menos = el("button",null,"−"), val = el("span","v",String(repeN)), mas = el("button",null,"+");
  menos.onclick = function(){ repeN = Math.max(1, repeN-1); pintaRepe(dk); };
  mas.onclick   = function(){ repeN = Math.min(31, repeN+1); pintaRepe(dk); };
  c.appendChild(menos); c.appendChild(val); c.appendChild(mas);
  var f = parseDk(dk), h = new Date(f); h.setDate(h.getDate()+repeN);
  $("repeSub").textContent = "hasta el " + h.getDate() + " de " + MESES[h.getMonth()];
  var esLibre = d.turno === "LIBRE" || d.turno === "VACAS";
  $("repeAplica").textContent = (esLibre ? "Marcar también los " : "Repetir en los ")
    + repeN + " días siguientes";
  $("repeCard").querySelector(".lbl").textContent =
    d.turno === "VACAS" ? "Marcar vacaciones seguidas"
    : (d.turno === "LIBRE" ? "Marcar más días libres" : "Repetir este turno");
}
/* Copia turno y tramos a los N dias siguientes. Perentorias y festivo no se
   copian: son de cada dia. */
function repetir(dk){
  var d = diaR(dk); if(!d) return;
  var f = parseDk(dk), destinos = [], ocupados = [];
  for(var i=1;i<=repeN;i++){
    var x = new Date(f); x.setDate(x.getDate()+i);
    var k = dkey(x), y = diaR(k);
    destinos.push(k);
    if(y && ((y.t||[]).length || y.turno)) ocupados.push(x.getDate());
  }
  if(ocupados.length && !confirm(
      "Los días " + ocupados.join(", ") + " ya tienen turno puesto.\n\n¿Los sustituyo?")) return;
  destinos.forEach(function(k){
    var w = mio(k);
    w.t = clone(d.t||[]); w.turno = d.turno || "";
  });
  guardar(); render();
  toast("Turno repetido en " + destinos.length + " días");
}
function addTramo(dk, ids){
  var w = mio(dk);
  var last = w.t[w.t.length-1];
  w.t.push({ i: last && last.o ? last.o : "", o:"" });
  guardar(); pintaEditor(dk, ids); render();
}

/* Nada de type="number": en un iPhone en español el teclado da coma decimal y
   el input la tira, asi que "10,25" se perderia. Texto + inputmode. */
/* Traga lo que sea que escriba: 1480,25 · 1.480,25 · 1480.25 · 1.480 · 10,25 €.
   Regla: si lo ultimo tras un punto o una coma son 1 o 2 cifras, eso es la parte
   decimal y el resto de separadores son miles. Si no, todo eran miles.        */
function aNum(s){
  s = String(s).trim().replace(/[\s €]/g, "");
  if(!s) return null;
  var neg = s.charAt(0) === "-"; if(neg) s = s.slice(1);
  if(!/^[\d.,]+$/.test(s)) return null;
  var m = s.match(/[.,](\d+)$/);
  if(m && m[1].length <= 2){
    var corte = s.length - m[0].length;
    s = s.slice(0, corte).replace(/[.,]/g, "") + "." + m[1];
  } else {
    s = s.replace(/[.,]/g, "");
  }
  var v = parseFloat(s);
  return isNaN(v) ? null : (neg ? -v : v);
}

/* Balance de toda la vida: positivo = le deben turnos */
function balanceCub(){
  var me = 0, yo = 0, gente = {};
  Object.keys(DB.meses).forEach(function(mk){
    var ds = DB.meses[mk].dias || {};
    Object.keys(ds).forEach(function(dk){
      var c = ds[dk].cub; if(!c || !c.tipo) return;
      var q = (c.quien || "").trim() || "sin nombre";
      if(!gente[q]) gente[q] = {me:0, yo:0};
      if(c.tipo === "ME"){ me++; gente[q].me++; } else { yo++; gente[q].yo++; }
    });
  });
  return {me:me, yo:yo, saldo:me-yo, gente:gente};
}

    var v = hhmm(inp.value);
    if(v === null){ inp.value = valor || ""; toast("Esa hora no existe"); return; }
    inp.value = v; alCambiar(v);
  };
  return inp;
}

/* ═══════════════ foto ═══════════════ */
function ponerFoto(file){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var S = 320, cv = document.createElement("canvas");
      cv.width = cv.height = S;
      var ctx = cv.getContext("2d");
      var lado = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, S, S);
      DB.foto = cv.toDataURL("image/jpeg", 0.82);
      guardar(); render(); toast("Foto guardada");
    };
    img.onerror = function(){ toast("No se pudo leer la imagen"); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ═══════════════ exportar ═══════════════ */
/* En una PWA instalada en el iPhone el <a download> no hace nada, asi que
   primero se intenta "Compartir" (que deja guardar en Archivos o iCloud). */
async function guardarFuera(nombre, texto, mime, aviso){
  var tipo = (mime||"text/plain")+";charset=utf-8";
  try{
    var f = new File([texto], nombre, {type:tipo});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:nombre});
      toast(aviso || "Guardado"); return true;
    }
  }catch(e){ if(e && e.name === "AbortError") return false; }
  try{
    var b = new Blob([texto], {type:tipo});
    var u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 800);
  }catch(e2){}
  return true;
}
function copiar(txt, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(ok); }, function(){ toast("No se pudo copiar"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast(ok); }catch(e){ toast("No se pudo copiar"); }
    ta.remove();
  }
}
function csv(){
  var L = ["fecha;dia;turno;entrada;salida;horas;nocturnidad;madrugue;partido;domingo;festivo;manutencion;perentorias"];
  Object.keys(DB.meses).sort().forEach(function(mk){
    var ds = DB.meses[mk].dias||{};
    Object.keys(ds).sort().forEach(function(dk){
      var d = ds[dk], c = calcDia(dk,d), t = d.t||[];
      L.push([dk, DIAS[parseDk(dk).getDay()], d.turno||"",
        t.length?t[0].i:"", t.length?t[t.length-1].o:"",
        num(c.horas), num(c.noc), c.mad, c.frac, c.dom, c.fes?1:0, c.manut, num(c.per)].join(";"));
    });
  });
  return "﻿"+L.join("\r\n");
}

/* ═══════════════ cambio de dia y de mes ═══════════════
   La app vive instalada en el movil y casi nunca se cierra del todo: hay que
   darse cuenta de que ha cambiado el dia (o el mes) sin recargar la pagina.  */
var dkVivo, mkVivo;
function compruebaFecha(){
  var d = hoyDate(), dkAhora = dkey(d), mkAhora = mkey(d);
  if(dkAhora === dkVivo) return;
  var cambiaMes = mkAhora !== mkVivo;
  /* si estaba mirando el mes que acaba de terminar, la llevo al nuevo;
     si se habia ido a mirar otro mes a proposito, la dejo donde estaba */
  if(cambiaMes && mesActivo === mkVivo) mesActivo = mkAhora;
  dkVivo = dkAhora; mkVivo = mkAhora;
  if(cambiaMes) cuadranteAlDia();
  render();
  if(cambiaMes) toast("Empieza " + MESES[d.getMonth()] + ". El mes anterior queda guardado.");
}
